# 职责：把仓库里那 18 道"卡口"第一次接到一个**不由任何人记得不记得**的执行者身上。
#
# 为什么现在才补：`scripts/check-package-size.sh` 的开头写着
#   「为什么这条必须是 CI 卡口而不是人工检查：首包超限…是在最后一次塞资源进包的时候悄悄越界的」
# —— 这个前提此前从未成立：仓库里没有任何 CI 配置，所有门都只在主工作区被手工跑过。
# 直接后果是 2026-09-19 那批只在**全新检出**才现形的缺陷（core.autocrlf ⇒ config 表落成 CRLF ⇒
# 夹具的跨行锚点匹配不上，4 条用例假红/假绿互见）在主工作区永远看不见。
#
# 为什么跑在 ubuntu 而不是 windows runner：ubuntu 更干净也更便宜，而且**它必然是一次全新检出**，
# 行尾、大小写、路径分隔符这类"只在我这台机器上成立"的问题会当场暴露 —— 这正是本文件存在的理由。
# 代价：Cocos Creator 构建不在这里跑（要登录与许可），所以产物类门会打 SKIPPED，
# 提审前仍须在装了编辑器的机器上构建后复跑（见 scripts/check-wechat-artifact.sh 的 SKIPPED 分支）。
name: build-and-gates

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支上后一次 push 取消还在跑的前一次。为什么值得加：实测最近 460 次成功 run 的推送间隔里
# 36% 小于单次耗时（5.4 分钟）—— 那一批 run 的结果没有任何人看，但钱照烧。
# ⚠ 别把它当"省一半"：被取消的 run **已消耗的分钟照常计费**，回收的只是取消之后不再跑的那半截，
#   按上面 36% 的命中率折算约 22%。Free 档 2000 分钟/月是被日均 29 次 run（≈158 分钟/天）烧穿的，
#   这条闸门只把 2.4 倍超支压到 1.8 倍，**不足以单独达标** —— 另一半靠自托管车道
#   （`.github/workflows/ci-selfhosted.yml`，不消耗托管分钟）。
# 为什么没有 paths-ignore：最近 120 笔提交里"只动 docs/"的是 **0 笔**（本仓纪律就是文档与代码同批），
#   命中率 0；而把 `**.md` 放进忽略名单会连带跳过 3 道真读 md 的门
#   （`check-checklist-*` 读收口清单.md、`check-doc-counts` 读 AGENTS.md、`check-eol-policy` 扫 *.md 行尾）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 等价性测试（内存实现 vs 真 Mongo）要一个真的 MongoDB。没有它时它们会打「跳过即未验证」，
    # 而 `InventoryEquipEquivalenceTest` 那一族是**故意 fail-closed** 的（"别让绿色冒充覆盖"）⇒
    # 2026-09-19 起 master 上常驻一条红（台账 #233）。给它一个服务容器，比把那条用例改成跳过对：
    # 跳过会让 185 条等价性承诺永远不成立，而这一整个仓库的存储层正确性就架在它们身上。
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # 镜像自带没有 HEALTHCHECK，Actions 只会等"容器起来了"；而 Mongo 起来到能接命令之间
        # 还差一两秒 —— 不等它，测试会正好卡在那条 fail-closed 的用例上（同一个红，换个原因）
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # env.sh 先看 JAVA_HOME 是否已是 17，是就直接用 —— setup-java 正好把 JAVA_HOME 指过去。
      # 版本必须与 server/pom.xml 的 <maven.compiler.release>17</maven.compiler.release> 一致。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 客户端工具链只有 typescript + @types/node；有 package-lock.json 所以用 ci 而不是 install。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client toolchain
        run: npm ci
        working-directory: client

      # `check-icon-legibility` 是 Python + Pillow（它把每张图标缩到 26px 逐对算像素差）。
      # 缺 Pillow 时那一门**故意退 2（前置不满足）而不是退 0** —— 那是"没验"不是"通过"，
      # 而 runner 上默认没有 Pillow ⇒ 静态门这一步必红。给它装上，让这门真的跑起来。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps for the art gates
        run: pip install pillow

      # 全量 = 代码生成 + 分层 + 契约一致 + 服务端编译打包 + 客户端 tsc + 服务端/客户端全套测试。
      # 注意 build.sh 只到"编译 + 测试"，静态门在下一步；两者合起来才是这个仓库的"全绿"。
      - name: Full build and tests
        run: bash scripts/build.sh

      # 全部静态门（含台账形状与编号唯一性、埋点覆盖、端点路径、配置消费、合规红线、Mongo 写入清单）。
      # 产物类门在没有 Cocos 构建时会打 [SKIPPED] 并说明"这不是通过"。
      - name: Static gates
        run: bash scripts/check.sh

  # 运行时探针里**不需要前端产物**的那一类：纯 HTTP，起一个 dev 后端就能跑。
  #
  # ⚠ **这是当前可达的上界，不是"探针批跑已经进 CI 了"**：35 份 `verify-*-runtime.mjs` 绝大多数要
  #   `client/build/web-mobile`，而 Cocos 构建在 ubuntu runner 上做不到（要登录与许可 ——
  #   与上面产物类门在 CI 里只能 SKIPPED 是同一条理由）。需要产物那一批仍要在装了编辑器的机器上
  #   按 AGENTS.md §二 的批跑纪律手工跑（2026-09-30 那笔实证：只跑自己碰的两份会漏掉真回归）。
  #
  # 为什么这一份值得单独进门禁：它是**服务端真链路的端到端**（真 HTTP、零夹具，`/nation/*` 里
  # 7 个端点走一遍，含建国/入籍/国库/科技/外交/任命/退国与两条负例，52 条判据）。它原来只在
  # "有人记得手工跑"的时候跑，而它是唯一能证明"服务端整条链路在 CI 环境里也成立"的量具。
  probes:
    runs-on: ubuntu-latest
    needs: verify
    env:
      # 这一份探针要求"新号主城 16 级"（B13 建国前置），而新号默认 1 级 —— 靠这个 **dev 专用**档位
      # 抬上去（`DevNewPlayerBoost`，`@Profile("dev")`，prod 读不到它）。两个变量都不设时行为与改动前一致。
      IRONOATH_DEV_CITY_LEVEL: '16'
      IRONOATH_DEV_START_AMOUNT: '2000000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # **起后端与跑探针必须在同一步**：分成两步时，上一步的后台进程会在步结束时被收走，
      # 探针连不上 8080 —— 症状是"探针红"，而真正的原因是进程没了。
      # `dev.sh` 自己会先 `mvn install -q` 把上游模块刷进本地仓库，再以 dev profile 起服务
      # （dev = storage: memory，所以这一步不需要 Mongo 服务容器）。
      - name: Boot the dev backend and run the nation live chain
        run: |
          set -euo pipefail
          nohup bash scripts/dev.sh > /tmp/backend.log 2>&1 &
          ready=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://localhost:8080/player/init \
              -H 'content-type: application/json' \
              -d "{\"requestId\":\"ci-ready-$i\",\"deviceId\":\"ci-ready-$i\",\"nickName\":\"ci\",\"avatarId\":1,\"clientTime\":$(date +%s%3N)}" \
              || true)
            if [ "$code" = "200" ]; then
              echo "后端就绪（第 $i 次探测，约 $((i * 2)) 秒）"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "后端 180 秒内没起来 —— 先看它自己的日志"
            tail -80 /tmp/backend.log
            exit 1
          fi
          BACKEND_ORIGIN=http://localhost:8080 node tools/verify-nation-live.mjs

      # 失败时把后端日志尾部带出来：探针只说"业务码不是 0"，而原因在服务端那一侧
      - name: Backend log（失败时）
        if: failure()
        run: tail -120 /tmp/backend.log
