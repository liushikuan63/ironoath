# 职责：生产环境配置。所有敏感项走环境变量注入，仓库里不留任何凭据。
# 启动：java -jar game-web.jar --spring.profiles.active=prod
ironoath:
  storage: mongo
  lock: redisson
  bot:
    task-queue: redis
  redis:
    address: ${IRONOATH_REDIS_ADDRESS}
  pay:
    # The GameItem callback and client signer use environment-specific merchant AppKeys.
    offer-id: ${IRONOATH_PAY_OFFER_ID:}
    env: ${IRONOATH_PAY_ENV:0}
    zone-id: ${IRONOATH_PAY_ZONE_ID:1}
    platform: ${IRONOATH_PAY_PLATFORM:android}
    app-key-prod: ${IRONOATH_PAY_APP_KEY_PROD:}
    app-key-sandbox: ${IRONOATH_PAY_APP_KEY_SANDBOX:}
    # Required GameItem callback identity; backend config separates production from sandbox.
    superapp-application-id: ${IRONOATH_PAY_SUPERAPP_APPLICATION_ID:}
    superapp-backend-config-id-prod: ${IRONOATH_PAY_SUPERAPP_BACKEND_CONFIG_ID_PROD:}
    superapp-backend-config-id-sandbox: ${IRONOATH_PAY_SUPERAPP_BACKEND_CONFIG_ID_SANDBOX:}
    # Tencent Superapp TC-Signature timestamp encryption key; never commit the actual value.
    superapp-signature-secret: ${IRONOATH_PAY_SUPERAPP_SIGNATURE_SECRET:}
  wechat:
    # Separate 32-byte Base64 key used only to encrypt short-lived session_key values in Redis.
    session-key-encryption-key: ${IRONOATH_WECHAT_SESSION_KEY_ENCRYPTION_KEY:}
  # 生产绝不下发 detail：里面含内部字段名、配置 id 与校验规则，泄漏等于给外挂作者送地图
  expose-detail: false

spring:
  data:
    mongodb:
      uri: ${IRONOATH_MONGO_URI}
      # 生产必须开事务支持（副本集）。B00 陷阱 3 要求「分布式锁 + MongoDB 事务 + requestId 幂等」
      auto-index-creation: false

server:
  port: ${IRONOATH_PORT:8080}
  # 生产由网关/负载均衡做超时控制，这里给一个偏保守的上限，避免慢请求长期占用线程
  tomcat:
    connection-timeout: 10s

logging:
  level:
    root: WARN
    com.ironoath: INFO
  file:
    name: ${IRONOATH_LOG_DIR:/var/log/ironoath}/game-web.log
  logback:
    rollingpolicy:
      # 单文件 100MB、保留 14 天：够复盘一次赛季事故，又不会把磁盘吃满
      max-file-size: 100MB
      max-history: 14
