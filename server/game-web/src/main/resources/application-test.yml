# 职责：测试环境配置。单测跑在这个 profile 下 —— 内存存储、不开真实端口、不连任何外部服务。
# 说明：game-web 的单测必须能在没有 MongoDB / Redis 的 CI 机器上跑通，
#       否则「跑一次测试要起三个容器」会让人干脆不跑测试（C00 公理四·五 的同一逻辑）。
ironoath:
  storage: memory
  pay:
    # 米大师参数是部署凭据，只能来自配置文件/环境变量，不进 contract/config（那会进版本库）。
    # 测试用假值：下单只需要 offerId 非空，验签由 PayBeansConfig 的本地实现负责
    offer-id: test-offer-id
    mode: game
    env: "1"
  ops:
    # 运维端点令牌（X-Ops-Token）。与 offerId 同类：凭据不进配置表，也不该由代码内置默认值。
    # 生产走 IRONOATH_OPS_TOKEN 环境变量；这里给假值只为让「带对令牌能过鉴权」这一条可测。
    # SeasonSettleAuthTest 里的 OPS_TOKEN 常量必须与此同步
    token: test-ops-token
  # 测试环境保留 detail，断言里可以直接校验错误详情，定位更快
  expose-detail: true

spring:
  data:
    mongodb:
      # 内存存储下不会用到；给一个非法地址是为了「万一有人误配成 mongo，测试会立刻失败」而不是连上开发库
      uri: mongodb://invalid-host-for-test:27017/ironoath_test

logging:
  level:
    com.ironoath: INFO
    root: WARN
